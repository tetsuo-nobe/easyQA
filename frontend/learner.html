<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>easyQA - 受講者</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <!-- ヘッダー: ページタイトルとサインアウトボタン -->
    <header class="header">
      <h1 class="header__title">easyQA - 受講者</h1>
      <div class="header__actions">
        <button id="signout-btn" class="btn btn--signout">サインアウト</button>
      </div>
    </header>

    <!-- 質問送信フォーム -->
    <section>
      <h2 class="section-title">質問・コメントを送信</h2>
      <div id="submit-error" class="message"></div>
      <form id="question-form">
        <div class="form-group">
          <label for="question-content">質問・コメント（必須・最大500文字）</label>
          <textarea id="question-content" maxlength="500" rows="4"></textarea>
          <p class="markdown-hint">Markdown記法が使えます</p>
        </div>
        <div class="form-group">
          <label for="question-name">名前（任意・最大50文字）</label>
          <input type="text" id="question-name" maxlength="50">
        </div>
        <div class="form-group">
          <label for="question-delete-password">削除用パスワード（必須・半角英数字8文字以上）</label>
          <input type="password" id="question-delete-password" maxlength="100" placeholder="半角英数字8文字以上">
        </div>
        <button type="submit" class="btn btn--primary">送信</button>
      </form>
    </section>

    <!-- 送信処理中メッセージ（初期非表示） -->
    <div id="submit-processing" class="message message--processing hidden">処理中です</div>

    <!-- 削除処理中メッセージ（初期非表示） -->
    <div id="delete-processing" class="message message--processing hidden">処理中です</div>

    <!-- 質問・回答一覧 -->
    <section class="question-list">
      <h2 class="section-title">質問・回答一覧</h2>
      <div id="question-list"></div>
    </section>
  </div>

  <!-- JavaScript読み込み -->
  <script src="https://cdn.jsdelivr.net/npm/marked@18.0.13/lib/marked.umd.min.js"
          integrity="sha384-fEbCbgYlveuklciAJcUGGDesw/JVf6LkfURCfpbN8v2RIPZVOvjnN3ovPyniGaxL"
          crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.15/dist/purify.min.js"
          integrity="sha384-uUMu9JDY09vBzRf9SPcK2VgUj+W/70J6Soc+Dded5P474ElQ63iv9j5N3DE7Kp3N"
          crossorigin="anonymous"></script>
  <script src="js/markdown.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/learner.js"></script>
</body>
</html>
